name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: node --test dist/tests/core.test.js

      - name: CLI smoke (version)
        run: node dist/src/cli/index.js --version

      - name: CLI smoke (doctor)
        run: node dist/src/cli/index.js doctor

      - name: Secret scan (no tokens in tree)
        shell: bash
        run: |
          if grep -rInE 'ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}' --include='*.ts' --include='*.json' --include='*.yaml' --include='*.md' src tests docs *.json *.yaml 2>/dev/null; then
            echo "::error::Potential secret found in tracked sources"; exit 1
          else
            echo "no secrets detected"
          fi
